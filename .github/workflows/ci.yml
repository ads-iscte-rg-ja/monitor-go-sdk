# Gerado a partir de monitor-platform/templates/ci.yml.
# Toda a lógica vive em monitor-platform; aqui só se escolhem as opções do repo.
# A versão do pipeline é fixada pela tag (@v1) do monitor-platform; para atualizar, mover a tag.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  go:
    uses: ads-iscte-rg-ja/monitor-platform/.github/workflows/go-ci.yml@v1
    with:
      # Os testes usam ../monitor-remote/database/schema.sql: o esquema do buffer pertence
      # ao remote e o SDK escreve nele (contrato entre os dois).
      sibling-repos: ads-iscte-rg-ja/monitor-remote
      # false durante a medição de baseline (iteração 0); true depois.
      lint-blocking: false
    secrets: inherit
